name: Android build

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'
  pull_request:
    # Keep this check optional because path filters can skip it.
    paths:
      - 'apps/mobile/android/**'
      - 'apps/mobile/package.json'
      - 'patches/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1, version from packageManager
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The Android SDK comes from the runner's ANDROID_HOME.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      # Compile one ABI to keep cold builds within the job timeout.
      - run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/mobile/android
