packages:
  - apps/*
  - packages/*
  - tools/*
# React Native/Metro cannot follow pnpm's symlinked layout
nodeLinker: hoisted
# Dependency install scripts we don't need: prebuilt binaries cover them, and
# ssh2/cpu-features are dockerode's unused SSH transport
allowBuilds:
  '@firebase/util': false # only reads FIREBASE_WEBAPP_CONFIG for web autoinit; we don't set it
  '@parcel/watcher': false
  cpu-features: false
  msgpackr-extract: false # optional native speed-up for bullmq's msgpackr; the JS fallback is enough
  protobufjs: false
  ssh2: false
  unrs-resolver: false
# Patched transitive deps (Snyk high). Drop each once its parent ships the fix.
overrides:
  # SNYK-JS-MULTER-21431602: Nest 11 pins multer 2.4.0; 2.5.0 is what Nest 12 ships, same deps (Nest 12 is out, PLAN §9)
  'multer@<2.5.0': 2.5.0
  # SNYK-JS-BODYPARSER-21431495: via express 5 and the RN CLI, both on ^2.2, so only the lockfile was behind
  'body-parser@>=2 <2.4.0': ^2.4.0
  # Snyk critical: firebase 13.1 > @firebase/firestore pins ~1.9.0; firestore's RN entry never loads grpc-js, the Node entry was smoke-tested on 1.14.6
  '@grpc/grpc-js@<1.13.6': 1.14.6
patchedDependencies:
  expo-modules-core@58.0.28: patches/expo-modules-core@58.0.28.patch
